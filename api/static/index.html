<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Croissant AI Studio</title>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for code highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f8f9fa;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --accent-color: #1a73e8;
            --user-msg-bg: #e8f0fe;
            --bot-msg-bg: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #202124;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #5f6368;
        }

        select, input[type="text"], input[type="password"] {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
        }

        .auth-card {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .auth-card a {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent-color);
            text-decoration: none;
        }
        
        .auth-card a:hover {
            text-decoration: underline;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message .avatar {
            width: 35px;
            height: 35px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background-color: var(--accent-color);
            color: #fff;
        }

        .message.assistant .avatar {
            background-color: #10a37f;
            color: #fff;
        }

        .message-content {
            flex: 1;
            background-color: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            line-height: 1.5;
            overflow-x: auto;
        }

        .message.user .message-content {
            background-color: var(--user-msg-bg);
        }

        .message-content p:first-child {
            margin-top: 0;
        }
        
        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* Input Area */
        .input-area {
            padding: 20px 40px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .input-container {
            max-width: 800px;
            width: 100%;
            position: relative;
            display: flex;
            gap: 10px;
        }

        textarea {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 15px;
            padding-right: 50px;
            border-radius: 12px;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            min-height: 24px;
            max-height: 200px;
            line-height: 1.5;
            overflow-y: auto;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .send-btn {
            position: absolute;
            right: 15px;
            bottom: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .send-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            background-color: #006bb3;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🥐 Croissant Studio</h2>
        
        <div class="control-group">
            <label for="model-select">Model</label>
            <select id="model-select">
                <option value="">Loading models...</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="api-key">API Key (Optional)</label>
            <input type="password" id="api-key" placeholder="Enter gateway key">
        </div>

        <div class="auth-card">
            <strong>ODRL Authentication</strong><br>
            <span id="auth-status" style="color: #5f6368;">Checking...</span><br>
            <a href="https://odrl.dev.codata.org/vcs">Login with Identity</a>
        </div>
        
        <div class="auth-card" style="margin-top: auto; font-size: 0.8rem; color: #888;">
            Connected to <strong>/gateway/v1/messages</strong><br>
            Powered by QLever MCP
        </div>
    </div>

    <div class="main-content">
        <div class="chat-history" id="chat-history">
            <div class="message assistant">
                <div class="avatar">AI</div>
                <div class="message-content">
                    <p>Welcome to the Semantic Croissant AI Studio! How can I help you query the dataset today?</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="prompt-input" placeholder="Ask a question about the datasets..." rows="1"></textarea>
                <button id="send-btn" class="send-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configure marked to use highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        const chatHistory = document.getElementById('chat-history');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const apiKeyInput = document.getElementById('api-key');
        
        let messages = [];

        // Auto-resize textarea
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Load models on startup
        async function loadModels() {
            try {
                const res = await fetch('/gateway/v1/models');
                const data = await res.json();
                
                modelSelect.innerHTML = '';
                if (data.data && data.data.length > 0) {
                    data.data.forEach(model => {
                        const opt = document.createElement('option');
                        opt.value = model.id;
                        opt.textContent = model.display_name || model.id;
                        modelSelect.appendChild(opt);
                    });
                } else {
                    modelSelect.innerHTML = '<option value="">No models found</option>';
                }
            } catch (err) {
                console.error("Failed to load models", err);
                modelSelect.innerHTML = '<option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>';
            }
        }
        
        loadModels();

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = role === 'user' ? 'U' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = marked.parse(content);
            
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            chatHistory.appendChild(msgDiv);
            
            // Scroll to bottom
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return contentDiv;
        }

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;
            
            const model = modelSelect.value || "claude-3-5-sonnet-20241022";
            const apiKey = apiKeyInput.value.trim();
            
            // Add to UI
            appendMessage('user', text);
            promptInput.value = '';
            promptInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            // Add to messages array
            messages.push({ role: 'user', content: text });
            
            // Create placeholder for assistant response
            const msgDiv = document.createElement('div');
            msgDiv.className = `message assistant`;
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = 'AI';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = '<p class="typing">...</p>';
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (apiKey) {
                    headers['Authorization'] = `Bearer ${apiKey}`;
                    headers['X-API-Key'] = apiKey;
                }

                const response = await fetch('/gateway/v1/messages', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        stream: true,
                        max_tokens: 4096
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    contentDiv.innerHTML = `<p style="color: #ff6b6b;">Error: ${response.status} - ${err}</p>`;
                    sendBtn.disabled = false;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullResponse = "";
                
                contentDiv.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'content_block_delta' && data.delta && data.delta.text) {
                                    fullResponse += data.delta.text;
                                    contentDiv.innerHTML = marked.parse(fullResponse);
                                    chatHistory.scrollTop = chatHistory.scrollHeight;
                                }
                            } catch (e) {
                                // Ignore parse errors for incomplete chunks
                            }
                        }
                    }
                }
                
                // Final render with highlights
                contentDiv.innerHTML = marked.parse(fullResponse);
                messages.push({ role: 'assistant', content: fullResponse });
                
            } catch (err) {
                console.error(err);
                contentDiv.innerHTML = `<p style="color: #ff6b6b;">Connection failed: ${err.message}</p>`;
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        
        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Simple auth check injected by server
        document.getElementById('auth-status').innerHTML = `{{AUTH_STATUS}}`;
    </script>
</body>
</html>
