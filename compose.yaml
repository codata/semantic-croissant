services:
  init:
    container_name: ${PROFILE_NAME:-croissant-live}-init
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: docker.io/library/busybox
    command:
      ["sh", "-c", "chown -R 65534:0 /data/server && chown -R 65534:0 /data/ui && chown -R 1000:0 /data/es && chown -R 1000:0 /data/minio"]
    stop_grace_period: 0s
    restart: "no"
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-croissant-live}/server:/data/server
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-croissant-live}/ui:/data/ui
      - ${VOLUME_DIR:-./volumes}/${PROFILE_NAME:-croissant-live}/es:/data/es
      - ${VOLUME_DIR:-./volumes}/${PROFILE_NAME:-croissant-live}/minio:/data/minio

  server:
    container_name: ${PROFILE_NAME:-croissant-live}-server
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: ghcr.io/zazukoians/qlever-server:latest
    user: "65534:0"
    stop_grace_period: 0s
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${QLEVER_SERVER_PORT:-7011}:7011"
    env_file:
      - path: ./${PROFILE_NAME:-croissant-live}.env
        required: false
      - path: ./profiles/${PROFILE_NAME:-croissant-live}.env
        required: false
    environment:
      - INDEXING=true
      - FORCE_INDEXING=true
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-croissant-live}/server:/data
      - ${DATA_DIR:-./qlever-tests/data}:/raw_data:ro

  ui:
    container_name: ${PROFILE_NAME:-croissant-live}-ui
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: ghcr.io/zazukoians/qlever-ui:latest
    user: "65534:0"
    stop_grace_period: 0s
    ports:
      - "${QLEVER_UI_PORT:-7012}:7012"
    env_file:
      - path: ./${PROFILE_NAME:-croissant-live}.env
        required: false
      - path: ./profiles/${PROFILE_NAME:-croissant-live}.env
        required: false
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-croissant-live}/ui:/app/db
    depends_on:
      - server

  elasticsearch:
    container_name: ${PROFILE_NAME:-croissant-live}-elasticsearch
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - ${VOLUME_DIR:-./volumes}/${PROFILE_NAME:-croissant-live}/es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    container_name: ${PROFILE_NAME:-croissant-live}-api
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: api-${PROFILE_NAME:-croissant-live}
    pull_policy: never
    ports:
      - "${API_PORT:-7013}:8000"
    env_file:
      - path: ./${PROFILE_NAME:-croissant-live}.env
        required: false
      - path: ./profiles/${PROFILE_NAME:-croissant-live}.env
        required: false
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hips:/app/hips:ro
      - ${DATA_DIR:-./qlever-tests/data}:/data
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-croissant-live}/server:/volumes/server
      - ./convertors:/app/convertors:ro
      - ./agents:/app/agents:ro
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - server
      - elasticsearch

  mcp:
    container_name: ${PROFILE_NAME:-croissant-live}-mcp
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: api-${PROFILE_NAME:-croissant-live}
    pull_policy: never
    command: ["python", "/app/mcp_server.py", "--transport", "sse"]
    ports:
      - "${MCP_PORT:-7070}:7070"
    env_file:
      - path: ./${PROFILE_NAME:-croissant-live}.env
        required: false
      - path: ./profiles/${PROFILE_NAME:-croissant-live}.env
        required: false
    environment:
      - API_BASE=http://api:8000
      - MCP_TRANSPORT=sse
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./convertors:/app/convertors:ro
      - ./agents:/app/agents:ro
      - ~/.odrl:/root/.odrl:ro
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - api
      - elasticsearch

  minio:
    container_name: ${PROFILE_NAME:-croissant-live}-minio
    profiles:
      - ${PROFILE_NAME:-croissant-live}
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9007}:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ${VOLUME_DIR:-./volumes}/${PROFILE_NAME:-croissant-live}/minio:/data

