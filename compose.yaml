services:
  init-croissant-live:
    profiles:
      - croissant-live
    image: docker.io/library/busybox
    command:
      ["sh", "-c", "chown -R 65534:0 /data/server && chown -R 65534:0 /data/ui"]
    stop_grace_period: 0s
    restart: "no"
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/server:/data/server
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/ui:/data/ui

  server-croissant-live:
    profiles:
      - croissant-live
    image: ghcr.io/zazukoians/qlever-server:latest
    user: "65534:0"
    stop_grace_period: 0s
    depends_on:
      init-croissant-live:
        condition: service_completed_successfully
    ports:
      - "7011:7011"
    env_file:
      - ./croissant-live.env
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/server:/data
      - ${DATA_DIR:-./qlever-tests/data}:/raw_data:ro

  ui-croissant-live:
    profiles:
      - croissant-live
    image: ghcr.io/zazukoians/qlever-ui:latest
    user: "65534:0"
    stop_grace_period: 0s
    ports:
      - "7012:7012"
    env_file:
      - ./croissant-live.env
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/ui:/app/db
    depends_on:
      - server-croissant-live

  api-croissant-live:
    profiles:
      - croissant-live
    image: api-croissant-live
    pull_policy: never
    ports:
      - "7013:8000"
    env_file:
      - ./croissant-live.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./qlever-tests/data}:/data
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/server:/volumes/server
    depends_on:
      - server-croissant-live

  mcp-croissant-live:
    profiles:
      - croissant-live
    image: api-croissant-live
    pull_policy: never
    command: ["python", "/app/mcp_server.py"]
    ports:
      - "7070:7070"
    env_file:
      - ./croissant-live.env
    environment:
      - API_BASE=http://api-croissant-live:8000
      - MCP_TRANSPORT=sse
    depends_on:
      - api-croissant-live
