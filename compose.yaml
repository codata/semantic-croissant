services:
  init:
    container_name: ${PROFILE_NAME:-default}-init
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: docker.io/library/busybox
    command:
      ["sh", "-c", "chown -R 65534:0 /data/server && chown -R 65534:0 /data/ui && chown -R 1000:0 /data/es && chown -R 65532:65532 /data/minio"]
    stop_grace_period: 0s
    restart: "no"
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/server:/data/server
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/ui:/data/ui
      - ./volumes/${PROFILE_NAME:-default}/es:/data/es
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/minio:/data/minio

  server:
    container_name: ${PROFILE_NAME:-default}-server
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: ghcr.io/zazukoians/qlever-server:latest
    user: "65534:0"
    stop_grace_period: 0s
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${QLEVER_SERVER_PORT:-7011}:7011"
    env_file:
      - ./profiles/${PROFILE_NAME:-default}.env
    environment:
      - INDEXING=${INDEXING:-false}
      - FORCE_INDEXING=${FORCE_INDEXING:-false}
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/server:/data
      - ${DATA_DIR:-./qlever-tests/data}:/raw_data:ro

  ui:
    container_name: ${PROFILE_NAME:-default}-ui
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: ghcr.io/zazukoians/qlever-ui:latest
    user: "65534:0"
    stop_grace_period: 0s
    ports:
      - "${QLEVER_UI_PORT:-7012}:7012"
    env_file:
      - ./profiles/${PROFILE_NAME:-default}.env
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/ui:/app/db
    depends_on:
      - server

  elasticsearch:
    container_name: ${PROFILE_NAME:-default}-elasticsearch
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - ./profiles/${PROFILE_NAME:-default}.env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx4g}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - ./volumes/${PROFILE_NAME:-default}/es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    container_name: ${PROFILE_NAME:-default}-api
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: api-${PROFILE_NAME:-default}
    pull_policy: never
    build:
      context: ./api
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-7013}:8000"
    env_file:
      - ./profiles/${PROFILE_NAME:-default}.env
    environment:
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - ES_GLOBAL_HOST=${ES_GLOBAL_HOST:-}
      - QLEVER_GLOBAL_HOST=${QLEVER_GLOBAL_HOST:-}
      - QLEVER_URL=${QLEVER_URL:-http://server:7011}
      - MINIO_GLOBAL_HOST=${MINIO_GLOBAL_HOST:-}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hips:/app/hips:ro
      - ${DATA_DIR:-./qlever-tests/data}:/data
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/server:/volumes/server
      - ./convertors:/app/convertors:ro
      - ./agents:/app/agents:ro
      - ~/.odrl:/app/.odrl
      - ./api/main.py:/app/main.py
      - ./api/mcp_server.py:/app/mcp_server.py
      - ./api/static/login.html:/app/static/login.html
      - ./api/static/index.html:/app/static/index.html
      - ./api/static/collections_index.html:/app/static/collections_index.html
      - ./api/static/collection_viewer.html:/app/static/collection_viewer.html
      - ./api/static/groups_index.html:/app/static/groups_index.html
      - ./api/static/variables_index.html:/app/static/variables_index.html
      - ./api/static/validate.html:/app/static/validate.html
      - ./api/static/profile.html:/app/static/profile.html
      - ./api/static/doc_viewer.html:/app/static/doc_viewer.html
      - ./api/static/generic_loading.html:/app/static/generic_loading.html
      - ./credentials.json:/app/credentials.json:ro
      - ./nodes.conf:/app/nodes.conf:ro
      - ./profiles:/app/profiles:ro
      - ./dumps:/app/dumps:ro
    depends_on:
      - server
      - elasticsearch

  mcp:
    container_name: ${PROFILE_NAME:-default}-mcp
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: api-${PROFILE_NAME:-default}
    pull_policy: never
    build:
      context: ./api
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["python", "/app/mcp_server.py", "--transport", "sse"]
    ports:
      - "${MCP_PORT:-7070}:7070"
    env_file:
      - ./profiles/${PROFILE_NAME:-default}.env
    environment:
      - API_BASE=http://api:8000
      - MCP_TRANSPORT=sse
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - ES_GLOBAL_HOST=${ES_GLOBAL_HOST:-}
      - QLEVER_GLOBAL_HOST=${QLEVER_GLOBAL_HOST:-}
      - QLEVER_URL=${QLEVER_URL:-http://server:7011}
      - MINIO_GLOBAL_HOST=${MINIO_GLOBAL_HOST:-}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
      - CDIF_CONVERTER_URL=${CDIF_CONVERTER_URL:-http://converters:8000}
      - CDIF_SERVICE=${CDIF_SERVICE:-http://converters:8000}
      - DDI_CDI_SERVICE=${DDI_CDI_SERVICE:-http://ddicdi:8000}
    volumes:
      - ./shapes:/app/shapes:ro
      - ./convertors:/app/convertors:ro
      - ./agents:/app/agents:ro
      - ~/.odrl:/app/.odrl
      - ./api/main.py:/app/main.py
      - ./api/mcp_server.py:/app/mcp_server.py
      - ./api/static/login.html:/app/static/login.html
      - ./api/static/index.html:/app/static/index.html
      - ./api/static/collections_index.html:/app/static/collections_index.html
      - ./api/static/collection_viewer.html:/app/static/collection_viewer.html
      - ./api/static/groups_index.html:/app/static/groups_index.html
      - ./api/static/variables_index.html:/app/static/variables_index.html
      - ./api/static/validate.html:/app/static/validate.html
      - ./api/static/profile.html:/app/static/profile.html
      - ./api/static/doc_viewer.html:/app/static/doc_viewer.html
      - ./api/static/generic_loading.html:/app/static/generic_loading.html
      - ./credentials.json:/app/credentials.json:ro
      - ./nodes.conf:/app/nodes.conf:ro
      - ./profiles:/app/profiles:ro
      - ./dumps:/app/dumps:ro
    depends_on:
      - api
      - elasticsearch

  minio:
    container_name: ${PROFILE_NAME:-default}-minio
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    ports:
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9007}:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/${PROFILE_NAME:-default}/minio:/data

  converters:
    container_name: ${PROFILE_NAME:-default}-converters
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: ${PROFILE_NAME:-default}-converters
    pull_policy: never
    build:
      context: ./tools/converters
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CONVERTERS_PORT:-8082}:8000"
    environment:
      - PORT=8000
      - CONVERTER_API_KEY=${CONVERTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ddicdi:
    container_name: ${PROFILE_NAME:-default}-ddicdi
    profiles:
      - ${PROFILE_NAME:-default}
      - ./profiles/${PROFILE_NAME:-default}.env
      - profiles/${PROFILE_NAME:-default}.env
      - croissant-live
    image: ddicdi-studio:latest
    restart: unless-stopped
    ports:
      - "${DDI_CDI_PORT:-8083}:8000"
    environment:
      - PORT=8000
      - DDI_API_KEY=${DDI_CDI_API_KEY:-}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


