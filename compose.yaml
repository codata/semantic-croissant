services:
  init-croissant-live:
    profiles:
      - croissant-live
    image: docker.io/library/busybox
    command:
      ["sh", "-c", "chown -R 65534:0 /data/server && chown -R 65534:0 /data/ui"]
    stop_grace_period: 0s
    restart: "no"
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/server:/data/server
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/ui:/data/ui

  server-croissant-live:
    profiles:
      - croissant-live
    image: ghcr.io/zazukoians/qlever-server:latest
    user: "65534:0"
    stop_grace_period: 0s
    depends_on:
      init-croissant-live:
        condition: service_completed_successfully
    ports:
      - "7011:7011"
    env_file:
      - ./croissant-live.env
    environment:
      - INDEXING=true
      - FORCE_INDEXING=true
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/server:/data
      - ${DATA_DIR:-./qlever-tests/data}:/raw_data:ro

  ui-croissant-live:
    profiles:
      - croissant-live
    image: ghcr.io/zazukoians/qlever-ui:latest
    user: "65534:0"
    stop_grace_period: 0s
    ports:
      - "7012:7012"
    env_file:
      - ./croissant-live.env
    volumes:
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/ui:/app/db
    depends_on:
      - server-croissant-live

  elasticsearch:
    profiles:
      - croissant-live
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - ${VOLUME_DIR:-./volumes}/es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  api-croissant-live:
    profiles:
      - croissant-live
    image: api-croissant-live
    pull_policy: never
    ports:
      - "7013:8000"
    env_file:
      - ./croissant-live.env
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hips:/app/hips:ro
      - ${DATA_DIR:-./qlever-tests/data}:/data
      - ${VOLUME_DIR:-./qlever-tests/volumes}/croissant-live/server:/volumes/server
      - ./convertors:/app/convertors:ro
      - ./agents:/app/agents:ro
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - server-croissant-live
      - elasticsearch

  mcp-croissant-live:
    profiles:
      - croissant-live
    image: api-croissant-live
    pull_policy: never
    command: ["python", "/app/mcp_server.py", "--transport", "sse"]
    ports:
      - "7070:7070"
    env_file:
      - ./croissant-live.env
    environment:
      - API_BASE=http://api-croissant-live:8000
      - MCP_TRANSPORT=sse
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./convertors:/app/convertors:ro
      - ./agents:/app/agents:ro
      - ~/.odrl:/root/.odrl:ro
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - api-croissant-live
      - elasticsearch

  minio:
    profiles:
      - croissant-live
    image: minio/minio:latest
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ${VOLUME_DIR:-./volumes}/minio_croissant:/data

